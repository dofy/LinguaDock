name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: >-
          xcodebuild test
          -project LinguaDock.xcodeproj
          -scheme LinguaDock
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
